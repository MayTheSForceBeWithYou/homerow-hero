name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Neovim nightly
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Setup stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          version: 0.20.0

      - name: Check Neovim version
        run: nvim --version

      - name: Run stylua
        run: stylua --check .

      - name: Load all Lua snippets headlessly
        run: bash tests/load_all_lua.sh

      - name: Run lesson verification scripts
        run: bash tests/run_headless_tests.sh
